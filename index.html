<head>
  <title>Product Card</title>
  <link rel="stylesheet" href="styl.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <div class="card">
      <picture>
        <source media="(max-width: 770px)" srcset="zdjm.jpg">
        <img src="zdj.jpg">
      </picture>
      <div class="content">
        <p class="category">PERFUME</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="desc">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
        <div class="price">
          <span class="new">$149.99</span>
          <span class="old">$169.99</span>
        </div>
        <button class="btn">
          <img src="icon-cart.svg">
          Add to Cart
        </button>
      </div>
    </div>
  </main>
</body>
