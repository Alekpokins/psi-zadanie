<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styl.css" />
</head>
<body>

  <div class="card">
    <picture>
      <source media="(min-width: 768px)" srcset="zdj.jpg">
      <img src="zdjm.jpg" alt="Gabrielle Essence Eau De Parfum">
    </picture>

    <div class="content">
      <p class="category">PERFUME</p>

      <h1 class="title">
        Gabrielle Essence Eau De Parfum
      </h1>

      <p class="desc">
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>

      <div class="price">
        <span class="current">$149.99</span>
        <span class="old">$169.99</span>
      </div>

      <button class="btn">
        <img src="icon-cart.svg" alt="">
        Add to Cart
      </button>
    </div>
  </div>

</body>
</html>
